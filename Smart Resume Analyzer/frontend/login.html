<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart Resume Analyzer</title>
    <link rel="stylesheet" href="css/style.css?v=3">
</head>

<body>

    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">
                <div class="logo-icon">📄</div>
                <span>Smart<span class="gradient-text">Resume</span></span>
            </a>
            <ul class="nav-links">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="job_role.html" class="nav-link">Job Roles</a></li>
                <li><a href="upload.html" class="nav-link">Upload Resume</a></li>
                <li><a href="score.html" class="nav-link">Resume Score</a></li>
                <li><a href="suggestions.html" class="nav-link">Suggestions</a></li>
                <li><a href="recommendations.html" class="nav-link">Recommendations</a></li>
                <li><a href="review.html" class="nav-link">Reviews</a></li>
            </ul>
            <div id="nav-user-area"></div>
        </div>
    </nav>

    <main style="flex:1; display:flex; align-items:center; justify-content:center; padding:60px 0;">
        <div class="container" style="max-width:460px;">
            <div class="card">
                <div style="text-align:center; margin-bottom:28px;">
                    <h2 style="font-size:2rem; margin-bottom:6px;">Welcome Back</h2>
                    <p style="color:var(--text-secondary); font-size:0.9rem;">Sign in to access your resume analysis
                        history</p>
                </div>

                <form id="login-form">
                    <div class="form-group">
                        <label class="form-label" for="login-email">Email Address</label>
                        <input type="email" id="login-email" class="form-input" placeholder="you@example.com" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="login-password">Password</label>
                        <input type="password" id="login-password" class="form-input" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width:100%; margin-top:10px;">
                        Sign In →
                    </button>
                </form>

                <div
                    style="margin-top:24px; padding-top:20px; border-top:1px solid var(--border-color); text-align:center; font-size:0.9rem; color:var(--text-secondary);">
                    Don't have an account? <a href="register.html" style="font-weight:600;">Create one here</a>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>Smart Resume Analyzer • Secure Werkzeug Password Hashing &amp; Session Handling</p>
        </div>
    </footer>

    <script src="js/diagram-background.js"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
